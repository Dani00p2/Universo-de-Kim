<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Universo 💜</title>

    <link rel="stylesheet" href="universo.css">
</head>

<body>

    <!-- Fondo espacial -->
    <div class="space"></div>

    <div class="nebula nebula-one"></div>
    <div class="nebula nebula-two"></div>

    <!-- Estrellas -->
    <div class="stars"></div>
    <div class="stars stars-two"></div>

    <!-- Planeta central -->
    <div class="planet-system">

        <div class="planet-glow"></div>

        <div class="saturn">
            <div class="saturn-body"></div>
            <div class="saturn-ring ring-back"></div>
            <div class="saturn-ring ring-front"></div>
        </div>

    </div>

    <!-- Título -->
    <section class="universe-title">

        <p>BIENVENIDA A</p>

        <h1>MI UNIVERSO</h1>

        <span>hecho un poquito más bonito porque estás tú 💜</span>

    </section>

    <!-- Menú orbital -->
    <section class="orbit-menu">

        <button class="planet-button memories" onclick="openSection('recuerdos')">
            ⭐
            <small>Recuerdos</small>
        </button>

        <button class="planet-button letters" onclick="openSection('cartas')">
            💌
            <small>Cartas</small>
        </button>

        <button class="planet-button music" onclick="openSection('musica')">
            🎵
            <small>Música</small>
        </button>

        <button class="planet-button constellation" onclick="openSection('constelacion')">
            ✦
            <small>Constelación</small>
        </button>

        <button class="planet-button yoongi" onclick="openSection('yoongi')">
            🐈‍⬛
            <small>Yoongi's Room</small>
        </button>

        <button class="planet-button secret" onclick="openSection('secreto')">
            🔐
            <small>Secreto</small>
        </button>

    </section>

    <!-- Frase inferior -->
    <div class="bottom-message">
        <span>✦</span>
        <p>De todos los universos posibles, me alegra coincidir contigo.</p>
        <span>✦</span>
    </div>

    <script src="script.js"></script>

</body>
</html>
